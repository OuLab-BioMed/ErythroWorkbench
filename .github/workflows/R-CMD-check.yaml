name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # Chinese string literals must be \uXXXX escapes: R parses source bytes as
      # the native encoding, so a raw literal loads with Encoding == "unknown"
      # and then silently fails to match in grepl(..., perl = TRUE), which is
      # how sample identity is decided. This guard is cheap and it fails loudly.
      - name: Guard against raw CJK literals in R sources
        run: python3 data-raw/escape_cjk.py --check R tests/testthat

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The package has no runtime dependencies, so this installs testthat only.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-vignettes")'
          error-on: '"error"'
          upload-snapshots: true
